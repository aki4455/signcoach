[project]
name = "signcoach"
version = "0.1.0"
description = "SignCoach: AI co-instructor for driving schools — road signs, traffic-rule checks and lesson reports from dashcam video"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.12",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    # torch 2.10.0 = CUDA 12.8 build; its CUDA libraries are already in the local uv cache.
    "torch==2.10.0",
    "torchvision==0.25.0",
    "ultralytics>=8.3.100",
    # ByteTrack needs `lap`; pinning it here stops Ultralytics from pip-installing it at runtime.
    "lap>=0.5.12",
    "huggingface-hub>=0.26",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
voice = [
    "piper-tts>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "pipeline"]

[tool.uv]
# Ultralytics depends on the GUI build "opencv-python". Installed next to
# "opencv-python-headless", both packages would fight over the same `cv2` module.
# This marker is never true, so uv drops the GUI build and we keep the headless one.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs model weights, a GPU or long videos (skipped by the deploy workflow)"]
